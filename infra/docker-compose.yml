x-spark-image: &spark-image
  image: data-engineering-sandbox/spark:3.5.1
  build:
    context: ./spark

services:
  garage:
    image: dxflrs/garage:v1.0.0
    env_file:
      - .env
    entrypoint: ["/garage"]
    command: ["-c", "/etc/garage.toml", "server"]
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "${S3_API_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  spark-master:
    <<: *spark-image
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  spark-worker-1:
    <<: *spark-image
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: "1G"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    ports:
      - "${SPARK_WORKER_1_UI_PORT:-8081}:8081"
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-worker-2:
    <<: *spark-image
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: "1G"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    ports:
      - "${SPARK_WORKER_2_UI_PORT:-8082}:8081"
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  jupyter:
    build:
      context: ./jupyter
    env_file:
      - .env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      SPARK_MASTER_URL: spark://spark-master:7077
      AWS_ACCESS_KEY_ID: ${GARAGE_STUDENT_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_STUDENT_SECRET_KEY}
      S3_ENDPOINT: http://garage:3900
      PYSPARK_SUBMIT_ARGS: >-
        --conf spark.hadoop.fs.s3a.endpoint=http://garage:3900
        --conf spark.hadoop.fs.s3a.endpoint.region=garage
        --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
        --conf spark.hadoop.fs.s3a.path.style.access=true
        --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
        --conf spark.hadoop.fs.s3a.bulk.delete.enabled=false
        --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        --conf spark.hadoop.fs.s3a.access.key=${GARAGE_STUDENT_ACCESS_KEY}
        --conf spark.hadoop.fs.s3a.secret.key=${GARAGE_STUDENT_SECRET_KEY}
        pyspark-shell
    depends_on:
      garage:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - jupyter-work:/home/jovyan/work
      - ../notebooks:/home/jovyan/work/notebooks:ro
      - ../datasets:/home/jovyan/work/datasets:ro
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/lab', timeout=5)\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

networks:
  sandbox-net:
    name: data-engineering-sandbox

volumes:
  garage-meta:
  garage-data:
  jupyter-work:
