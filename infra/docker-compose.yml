services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2024-06-13T22-53-53Z
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - sandbox-net
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    volumes:
      - ./minio/init-minio.sh:/init-minio.sh:ro
      - ../datasets/sample.csv:/sample.csv:ro
    restart: "no"

  spark-master:
    image: apache/spark:3.5.1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/7077)' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  spark-worker-1:
    image: apache/spark:3.5.1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: "1G"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    ports:
      - "${SPARK_WORKER_1_UI_PORT:-8081}:8081"
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/8081)' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-worker-2:
    image: apache/spark:3.5.1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: "1G"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    ports:
      - "${SPARK_WORKER_2_UI_PORT:-8082}:8081"
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/8081)' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  jupyter:
    build:
      context: ./jupyter
    env_file:
      - .env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      SPARK_MASTER_URL: spark://spark-master:7077
      AWS_ACCESS_KEY_ID: ${MINIO_STUDENT_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_STUDENT_SECRET_KEY}
      MINIO_ENDPOINT: http://minio:9000
      PYSPARK_SUBMIT_ARGS: >-
        --packages org.apache.hadoop:hadoop-aws:3.3.4
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
        --conf spark.hadoop.fs.s3a.path.style.access=true
        --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
        --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        --conf spark.hadoop.fs.s3a.access.key=${MINIO_STUDENT_ACCESS_KEY}
        --conf spark.hadoop.fs.s3a.secret.key=${MINIO_STUDENT_SECRET_KEY}
        pyspark-shell
    depends_on:
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - jupyter-work:/home/jovyan/work
      - ../notebooks:/home/jovyan/work/notebooks:ro
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/lab', timeout=5)\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

networks:
  sandbox-net:
    name: data-engineering-sandbox

volumes:
  minio-data:
  jupyter-work:
